services:
  the-fold:
    build: .
    # Or, once the GitHub Action has published an image:
    # image: ghcr.io/aceospades95/the-fold:latest
    container_name: the-fold
    ports:
      - '8484:8484'
    volumes:
      - ./data:/data
    environment:
      # Set to your local timezone so recurring bills and "today" line up with your day.
      - TZ=America/Denver
    restart: unless-stopped
